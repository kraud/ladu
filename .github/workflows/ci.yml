name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job here pushes anywhere or writes packages — every job only needs to
# read the checked-out code (flagged by CodeQL: "Workflow does not contain
# permissions").
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w backend
      - run: npm run lint -w frontend

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w backend
      - run: npm run typecheck -w frontend

  backend:
    name: Backend (Jest + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: keelapp_user
          POSTGRES_PASSWORD: keelapp_password
          POSTGRES_DB: keelapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelapp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://keelapp_user:keelapp_password@localhost:5432/keelapp_test
      JWT_SECRET: test_secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w backend

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test -w frontend
      - run: npm run build -w frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: keelapp_user
          POSTGRES_PASSWORD: keelapp_password
          POSTGRES_DB: keelapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelapp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The webServer-spawned backend runs in dev mode (not NODE_ENV=test), so
      # it reads DATABASE_URL, not TEST_DATABASE_URL. The webServer command
      # (e2e/playwright.config.ts) runs backend/scripts/migrate.js before
      # starting the server — no separate CI step needed.
      DATABASE_URL: postgresql://keelapp_user:keelapp_password@localhost:5432/keelapp_e2e
      JWT_SECRET: e2e_test_secret
      BASE_URL: http://localhost:5173
      # sendMail (backend/utils/sendEmail.js) catches its own send errors and
      # never rejects, so registration/verification flows work without a real
      # mailbox — these just need to be set so nodemailer.createTransport
      # doesn't get undefined values.
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USER: e2e@ladu.test
      EMAIL_PASS: e2e_test_pass
      EMAIL_SECURE: "false"
      EMAIL_FROM: e2e@ladu.test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  images:
    name: Docker images (build + Trivy scan)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Build context is the repo root for backend/frontend (npm
          # workspaces share one root lockfile — see each Dockerfile's own
          # top comment), and landing/ itself for landing (not a workspace).
          - image: backend
            dockerfile: backend/Dockerfile
            context: .
            build-args: GIT_SHA=${{ github.sha }}
          - image: web
            dockerfile: frontend/Dockerfile
            context: .
            build-args: ""
          - image: landing
            dockerfile: landing/Dockerfile
            context: landing
            build-args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ladu-${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ladu-${{ matrix.image }}:ci
          build-args: ${{ matrix.build-args }}
      - name: Scan ladu-${{ matrix.image }} for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ladu-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # See .trivyignore's own comment: CVEs the web/landing images carry
          # only because caddy:alpine hasn't been rebuilt against a patched
          # Go toolchain yet — nothing on our side to fix.
          trivyignores: .trivyignore
