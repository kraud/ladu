name: Deploy

on:
  push:
    branches: [main]

# Never run two deploys at once — a second merge to main while one is still
# rolling out would race it (see .dev-context/deployment-strategy.md §3).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The repo's default GITHUB_TOKEN permissions are read-only (checked
      # via `gh api repos/kraud/ladu/actions/permissions/workflow`) — this
      # job needs write to publish to GHCR.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Same three images ci.yml's `images` job already built (without
          # pushing) and Trivy-scanned on this same commit before it could
          # merge to main — no need to scan again here.
          - image: backend
            dockerfile: backend/Dockerfile
            context: .
            build-args: GIT_SHA=${{ github.sha }}
          - image: web
            dockerfile: frontend/Dockerfile
            context: .
            build-args: ""
          - image: landing
            dockerfile: landing/Dockerfile
            context: landing
            build-args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ladu-${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/kraud/ladu-${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
