version: 2
updates:
  # npm workspaces monorepo — a single entry at the root covers backend,
  # frontend and e2e (Dependabot reads the workspaces field itself).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # ts-jest doesn't support TypeScript 7's compiler API yet (TS7 split
      # it into a native/Rust implementation) — a major bump here breaks
      # every backend Jest suite outright. Drop this once ts-jest adds
      # support, or the repo migrates off ts-jest.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base images: add one entry per directory once Phase B creates the
  # Dockerfiles (backend/, frontend/, landing/, deploy/caddy/) — Dependabot's
  # docker ecosystem needs an exact directory per Dockerfile, not a recursive
  # scan, so there's nothing to point at yet.
