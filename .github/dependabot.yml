version: 2
updates:
  # npm workspaces monorepo — a single entry at the root covers backend,
  # frontend and e2e (Dependabot reads the workspaces field itself).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # PAUSED: 0 stops version-update PRs only. Security-update PRs have their
    # own limit and keep arriving. The updates are done by hand, in order
    # (.context/plans/dependency-updates.md). Its last PR removes this line.
    open-pull-requests-limit: 0
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # ts-jest doesn't support TypeScript 7's compiler API yet (TS7 split
      # it into a native/Rust implementation) — a major bump here breaks
      # every backend Jest suite outright. Drop this once ts-jest adds
      # support, or the repo migrates off ts-jest.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # landing/ is not an npm workspace (own lockfile, for the blog build), so
  # the root entry above does not cover it.
  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker images that run on the VPS and are pinned to an exact version: the
  # edge Caddy (deploy/caddy/Dockerfile) and Postgres (deploy/compose/
  # docker-compose.platform.yml). Nothing else keeps them current: CI neither rebuilds nor
  # scans them, and Compose only pulls an image that is missing. Dependabot
  # needs an exact directory per entry, not a recursive scan.
  #
  # The app images (backend/, frontend/, admin/, landing/) are not listed: they
  # use floating base tags (`node:24-alpine`, `caddy:alpine`) that CI pulls
  # fresh on every build and scans with Trivy.
  - package-ecosystem: "docker"
    directory: "/deploy/caddy"
    schedule:
      interval: "weekly"

  # Dependabot's docker-compose support only reads files named like
  # `docker-compose*.yml` or `compose*.yml`. This is why the platform stack file is
  # `docker-compose.platform.yml` in the repo (Ansible syncs it to the server as
  # `platform.yml`). `app.yml` has no pinned third-party image, so it is not read.
  # `docker-compose.local.yml` is read too, but it holds only local images.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
