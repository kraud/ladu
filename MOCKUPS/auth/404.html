<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · Ladu</title>
<link rel="stylesheet" href="../assets/app.css" />
<style>
  .nf-code { font-family: var(--font-display); font-size: clamp(56px, 8vw, 96px); line-height: 1; letter-spacing: -0.03em; }
  .nf-cycle { display: block; min-height: 1.5em; margin-top: 8px; transition: opacity .3s ease; font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--muted); }
  .nf-cycle.fade { opacity: 0; }
  .nf-form { text-align: center; }
  .nf-divider { display: flex; align-items: center; gap: 12px; color: var(--border); width: min(220px, 50vw); margin: 18px auto; }
  .nf-divider::before, .nf-divider::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
  @media (prefers-reduced-motion: reduce) { .nf-cycle { transition: none; } }
</style>
</head>
<body>
<div class="auth-shell page" data-od-id="not-found">

  <aside class="auth-brand" data-od-id="auth-brand">
    <img class="auth-brand-mark" src="../assets/ladu-inside-bubble-outline.svg" alt="Ladu" width="190" height="178" />
    <div class="stack-sm">
      <p class="auth-tagline">Your words, four languages, one shelf.</p>
      <p class="auth-sub">This page isn't on the shelf — but everything else is.</p>
    </div>
    <div class="flag-row" aria-label="Supported in-app languages">
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#1e3a7a"/><path d="M0 0 60 40M60 0 0 40" stroke="#fff" stroke-width="8"/><path d="M0 0 60 40M60 0 0 40" stroke="#c8102e" stroke-width="4"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="7"/></svg>EN</span>
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#c60b1e"/><rect y="10" width="60" height="20" fill="#ffc400"/></svg>ES</span>
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="13.3" fill="#1d1b17"/><rect y="13.3" width="60" height="13.4" fill="#c8102e"/><rect y="26.6" width="60" height="13.4" fill="#f0b429"/></svg>DE</span>
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="13.3" fill="#0072ce"/><rect y="13.3" width="60" height="13.4" fill="#101010"/><rect y="26.6" width="60" height="13.4" fill="#fff"/></svg>EE</span>
    </div>
    <div class="auth-lang">
      <label class="auth-lang-select">
        <svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#1e3a7a"/><path d="M0 0 60 40M60 0 0 40" stroke="#fff" stroke-width="8"/><path d="M0 0 60 40M60 0 0 40" stroke="#c8102e" stroke-width="4"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="7"/></svg>
        <select aria-label="Interface language">
          <option selected>English</option>
          <option>Español</option>
          <option>Deutsch</option>
          <option>Eesti</option>
        </select>
      </label>
    </div>
  </aside>

  <main class="auth-panel">
    <div class="auth-form nf-form">
      <span class="nf-code">404</span>
      <div class="nf-divider" aria-hidden="true"></div>
      <span class="nf-cycle" id="cycle" aria-live="polite">Siin pole midagi vaadata…</span>
      <a class="btn btn-primary" href="../dashboard.html" style="margin-top: 20px;">Go to dashboard</a>
    </div>
  </main>

</div>

<script>
const lines = [
  'Siin pole midagi vaadata…',
  'Nothing to see here…',
  'Hier gibt es nichts zu sehen…',
  'No hay nada que ver aquí…'
];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let i = 0;
const el = document.getElementById('cycle');
if (reduced) {
  setInterval(() => { i = (i + 1) % lines.length; el.textContent = lines[i]; }, 2600);
} else {
  setInterval(() => {
    el.classList.add('fade');
    setTimeout(() => { i = (i + 1) % lines.length; el.textContent = lines[i]; el.classList.remove('fade'); }, 300);
  }, 2600);
}
</script>
</body>
</html>
