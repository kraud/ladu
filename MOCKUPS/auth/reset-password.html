<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set new password · Ladu</title>
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<div class="auth-shell page" data-od-id="reset-password">
  <a class="logo auth-banner" href="../index.html"><span class="logo-mark">L</span>Ladu</a>

  <!-- Set mode: both :userId and :tokenId present in the route -->
  <div class="card auth-card" style="padding: 24px;">
    <h1 class="h2" style="margin-bottom: 4px;">Set a new password</h1>
    <p class="muted" style="font-size: 13.5px; margin-bottom: 20px;">Choose something you haven't used before.</p>

    <form id="reset-form" novalidate>
      <div class="stack-md">
        <div class="field">
          <label class="label" for="password">New password <span class="req">*</span></label>
          <input class="input" id="password" type="password" autocomplete="new-password" required />
          <span class="err" id="password-err">At least 8 characters</span>
        </div>
        <div class="field">
          <label class="label" for="password2">Confirm new password <span class="req">*</span></label>
          <input class="input" id="password2" type="password" autocomplete="new-password" required />
          <span class="err" id="password2-err">Passwords must match</span>
        </div>
        <button class="btn btn-primary" id="submit" type="submit" style="width: 100%; margin-top: 4px;">Update password</button>
      </div>
    </form>

    <div class="auth-links">
      <span>Already registered?</span><a href="login.html">Sign in</a>
    </div>
  </div>

  <p class="meta" style="margin-top: 24px; max-width: 360px; text-align: center;">
    Request mode (no token in the URL) renders the same card with a single email field and a
    <b>Send reset link</b> button — one route, mode-conditional schema.
  </p>
</div>

<div class="toast-stack" id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
function toast(kind, msg) {
  const icons = { success: 'M20 6 9 17l-5-5', error: 'M18 6 6 18M6 6l12 12' };
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<svg class="t-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="${icons[kind]}"/></svg><span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
const pw = $('#password'), pw2 = $('#password2');
[pw, pw2].forEach(i => i.addEventListener('input', () => {
  i.parentElement.querySelector('.err').classList.remove('show');
  i.removeAttribute('aria-invalid');
}));
$('#reset-form').addEventListener('submit', e => {
  e.preventDefault();
  const pwBad = pw.value.length < 8, mBad = pw2.value !== pw.value || !pw2.value;
  $('#password-err').classList.toggle('show', pwBad);
  pw.setAttribute('aria-invalid', pwBad ? 'true' : 'false');
  $('#password2-err').classList.toggle('show', mBad);
  pw2.setAttribute('aria-invalid', mBad ? 'true' : 'false');
  if (pwBad || mBad) return;
  const btn = $('#submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Updating…';
  setTimeout(() => {
    toast('success', 'Password updated — sign in with your new password.');
    setTimeout(() => location.href = 'login.html', 900);
  }, 850);
});
</script>
</body>
</html>
