<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Ladu</title>
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<div class="auth-shell page" data-od-id="login">

  <aside class="auth-brand" data-od-id="auth-brand">
    <img class="auth-brand-mark" src="../assets/ladu-inside-bubble-outline.svg" alt="Ladu" width="190" height="178" />
    <div class="stack-sm">
      <p class="auth-tagline">Your words, four languages, one shelf.</p>
      <p class="auth-sub">Ladu keeps every word — and all its translations — in one place, across everything you study.</p>
    </div>
    <div class="flag-row" aria-label="Supported in-app languages">
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#1e3a7a"/><path d="M0 0 60 40M60 0 0 40" stroke="#fff" stroke-width="8"/><path d="M0 0 60 40M60 0 0 40" stroke="#c8102e" stroke-width="4"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="7"/></svg>EN</span>
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#c60b1e"/><rect y="10" width="60" height="20" fill="#ffc400"/></svg>ES</span>
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="13.3" fill="#1d1b17"/><rect y="13.3" width="60" height="13.4" fill="#c8102e"/><rect y="26.6" width="60" height="13.4" fill="#f0b429"/></svg>DE</span>
      <span class="flag-chip"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="13.3" fill="#0072ce"/><rect y="13.3" width="60" height="13.4" fill="#101010"/><rect y="26.6" width="60" height="13.4" fill="#fff"/></svg>EE</span>
    </div>
    <div class="auth-lang">
      <label class="auth-lang-select">
        <svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#1e3a7a"/><path d="M0 0 60 40M60 0 0 40" stroke="#fff" stroke-width="8"/><path d="M0 0 60 40M60 0 0 40" stroke="#c8102e" stroke-width="4"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="7"/></svg>
        <select aria-label="Interface language">
          <option selected>English</option>
          <option>Español</option>
          <option>Deutsch</option>
          <option>Eesti</option>
        </select>
      </label>
    </div>
  </aside>

  <main class="auth-panel">
    <div class="auth-form">
      <div class="form-head">
        <h1 class="h2">Sign in</h1>
        <p>Sign in to your Ladu shelf.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="stack-md">
          <div class="field">
            <span class="label-row">
              <label class="label" for="email">Email</label>
              <a href="reset-password.html">Forgot password?</a>
            </span>
            <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            <span class="err" id="email-err">Enter a valid email address</span>
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <span class="err" id="password-err">Password is required</span>
          </div>
          <button class="btn btn-primary" id="submit" type="submit" style="width: 100%; margin-top: 4px;">Sign in</button>
        </div>
      </form>

      <p class="auth-foot">Not registered? <a href="register.html">Create an account</a></p>
    </div>
  </main>

</div>

<div class="toast-stack" id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
function toast(kind, msg) {
  const icons = { success: 'M20 6 9 17l-5-5', error: 'M18 6 6 18M6 6l12 12', warning: 'M12 8v5m0 4h.01', info: 'M12 16v-5m0-4h.01' };
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<svg class="t-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="${icons[kind]}"/></svg><span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
function setErr(input, errId, show) {
  $('#' + errId).classList.toggle('show', show);
  input.setAttribute('aria-invalid', show ? 'true' : 'false');
}
const email = $('#email'), password = $('#password');
email.addEventListener('input', () => setErr(email, 'email-err', false));
password.addEventListener('input', () => setErr(password, 'password-err', false));

$('#login-form').addEventListener('submit', e => {
  e.preventDefault();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  const pwOk = password.value.length > 0;
  setErr(email, 'email-err', !emailOk);
  setErr(password, 'password-err', !pwOk);
  if (!emailOk || !pwOk) { (emailOk ? password : email).focus(); return; }

  const btn = $('#submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = 'Sign in';
    if (email.value.trim().startsWith('unverified')) {
      toast('warning', 'You need to verify your account before signing in.');
    } else {
      toast('success', 'Welcome back.');
      setTimeout(() => location.href = '../dashboard.html', 700);
    }
  }, 850);
});
</script>
</body>
</html>
