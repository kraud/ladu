name: keelapp-v2

services:
  # PostgreSQL for the v2 reimplementation. Deliberately a separate container,
  # project, volume, and host port from the legacy app's `keelapp-postgres` —
  # we start with empty databases; no data is migrated from the legacy stack.
  postgres:
    image: postgres:15-alpine
    container_name: keelapp-v2-postgres

    # Always restart the container if it stops unexpectedly, ensuring the
    # database is always available during local development.
    restart: always

    environment:
      # The default superuser credentials for the PostgreSQL instance.
      # These are used to connect to the database from the application.
      POSTGRES_USER: keelapp_user
      POSTGRES_PASSWORD: keelapp_password

      # The default development database, created on first start (empty volume).
      POSTGRES_DB: keelapp_v2_dev

    ports:
      # Host 5433 → container 5432. Kept off 5432 so this container can run
      # alongside the legacy app's container without a port conflict.
      - "5433:5432"

    volumes:
      # Named volume for this container only.
      - pgdata:/var/lib/postgresql/data

      # Initialization script (runs only on first start): creates the test db.
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

# Named volume for this container only.
volumes:
  pgdata:
