# Non-secret variables shared by every role. Secrets themselves live in
# vault.yml (encrypted), prefixed vault_* by convention -- the names below
# just wire the non-secret parts (usernames, DB names) together with them,
# so a role never references vault_* directly.

domain: ladu.com.ar
deploy_user: deploy
deploy_public_key_path: ~/.ssh/ladu_deploy.pub
# Separate from deploy_public_key_path above: this one's private half is
# what GitHub Actions uses (Phase D) to SSH in and run deploy.sh — narrower
# purpose than the admin key used for full server config, so it gets its own
# keypair rather than reusing the admin one.
ci_deploy_public_key_path: ~/.ssh/ladu_ci_deploy.pub
timezone: Etc/UTC

postgres_superuser: ladu_admin
postgres_superuser_password: "{{ vault_postgres_superuser_password }}"
cloudflare_dns_token: "{{ vault_cloudflare_dns_token }}"

# Phase E: nightly ladu_prod backup to Backblaze B2 + weekly restore test.
b2_bucket_name: ladu-db-backups
b2_key_id: "{{ vault_b2_key_id }}"
b2_application_key: "{{ vault_b2_application_key }}"
healthchecks_ping_url: "{{ vault_healthchecks_ping_url }}"

environments:
  - name: staging
    db_name: ladu_staging
    db_user: ladu_staging
    db_password: "{{ vault_staging_db_password }}"
  - name: prod
    db_name: ladu_prod
    db_user: ladu_prod
    db_password: "{{ vault_prod_db_password }}"
