---
# Installs Docker from Docker's own apt repository (Debian's own package is
# usually an older version), then lets `deploy` run docker commands without
# sudo. See the role's README note in deployment-strategy.md §Phase C for
# why DOCKER-USER firewall rules are handled in the `platform` role instead
# of here.

- name: Install Docker's apt-repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian # required by the deb822_repository module below
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: >-
      {{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy to the docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
