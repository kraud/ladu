---
# Sub-slice 8a: get the platform stack's files onto the VPS and lay out
# /opt/ladu/. Deliberately narrow — only platform.yml and the caddy/ build
# context are synced (not the whole deploy/ folder, and never ansible/ or
# terraform/). No secrets, no containers started yet.

- name: Install rsync (needed by the synchronize tasks below)
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Create the /opt/ladu directory layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - /opt/ladu
    - /opt/ladu/platform
    - /opt/ladu/platform/compose
    - /opt/ladu/platform/caddy
    - /opt/ladu/staging
    - /opt/ladu/prod

- name: Sync platform.yml
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../compose/platform.yml"
    dest: /opt/ladu/platform/compose/platform.yml
    delete: true
    perms: false
    owner: false
    group: false
  become: false

- name: Sync the Caddy build context
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../caddy/"
    dest: /opt/ladu/platform/caddy/
    delete: true
    perms: false
    owner: false
    group: false
  become: false

# --- Sub-slice 8b: real secrets, for the first time. ---

- name: Write the platform .env file
  ansible.builtin.template:
    src: platform.env.j2
    dest: /opt/ladu/platform/.env
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true

# --- Sub-slice 8c: bring the stack up for real. ---
# `landing` is started in its own task further down, not with postgres/edge:
# it's the only service pulled from GHCR (edge is built locally, postgres is
# a stock image), and it needs `pull: always` so a re-run picks up a newer
# page without touching the other two.

- name: Install python3-requests (needed by the docker_container_exec module)
  ansible.builtin.apt:
    name: python3-requests
    state: present

# `ladu-backend` and `ladu-admin` are private GHCR packages, so every pull of
# them needs a login. Two things pull them: `deploy.sh` (run over SSH by CI as
# `deploy`) and a rollback. Both read the `deploy` user's Docker config, which
# this task writes (~/.docker/config.json, mode 0600). That is why it runs as
# `deploy` (become: false) and not as root. `ladu-web` and `ladu-landing` stay
# public; the login is harmless for them.
# The token is a read-only classic PAT. It has an expiry: when it runs out,
# deploys fail with "denied". See 05-troubleshooting-playbook.md.
- name: Log in to GHCR so the VPS can pull the private images
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_pull_token }}"
    state: present
  no_log: true
  become: false

- name: Create the caddy-config directory for the generated trusted-proxies file
  ansible.builtin.file:
    path: /opt/ladu/platform/caddy-config
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Fetch current Cloudflare IPv4 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v4
    return_content: true
  register: cf_ipv4_platform
  # A read-only download, so it is safe to run in --check mode. Without this,
  # a dry run skips it and the next task fails ("no attribute 'content'").
  check_mode: false
  retries: 3
  delay: 5
  until: cf_ipv4_platform.status == 200

- name: Fetch current Cloudflare IPv6 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v6
    return_content: true
  register: cf_ipv6_platform
  # A read-only download, so it is safe to run in --check mode. Without this,
  # a dry run skips it and the next task fails ("no attribute 'content'").
  check_mode: false
  retries: 3
  delay: 5
  until: cf_ipv6_platform.status == 200

- name: Write Caddy's trusted-proxies snippet
  ansible.builtin.template:
    src: trusted_proxies.caddy.j2
    dest: /opt/ladu/platform/caddy-config/trusted_proxies.caddy
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  vars:
    cloudflare_ranges: "{{ cf_ipv4_platform.content.split() + cf_ipv6_platform.content.split() }}"
  register: trusted_proxies_file

# `build: always`, because the Caddyfile is copied INTO the edge image when it
# is built (deploy/caddy/Dockerfile: `COPY Caddyfile`). The module's default
# (`policy`) builds only an image that does not exist yet, so after the first
# run a changed Caddyfile (a new hostname, a new route) would never reach the
# running proxy. With `always`, Docker's layer cache makes an unchanged run
# fast, and Compose recreates the edge container only when the image changed.
# Certificates survive that: they live in the `caddy_data` volume.
- name: Bring up postgres and edge
  community.docker.docker_compose_v2:
    project_src: /opt/ladu/platform/compose
    project_name: ladu-platform
    files:
      - platform.yml
    env_files:
      - ../.env
    services:
      - postgres
      - edge
    build: always
    state: present
  become: false

# Runs after edge on purpose (edge only needs landing at request time, so the
# order isn't a hard dependency). `image_tag` defaults to `latest`, which
# deploy.yml's build-and-push job moves on every merge to main. The page is
# not part of the per-commit app deploy: re-run this role to publish a change.
- name: Bring up landing (pulls the newest image)
  community.docker.docker_compose_v2:
    project_src: /opt/ladu/platform/compose
    project_name: ladu-platform
    files:
      - platform.yml
    env_files:
      - ../.env
    services:
      - landing
    pull: always
    state: present
  become: false

- name: Restart edge if the trusted-proxies list changed
  community.docker.docker_compose_v2:
    project_src: /opt/ladu/platform/compose
    project_name: ladu-platform
    files:
      - platform.yml
    env_files:
      - ../.env
    services:
      - edge
    state: restarted
  become: false
  when: trusted_proxies_file.changed

- name: Wait for Postgres to accept connections
  community.docker.docker_container_exec:
    container: ladu-platform-postgres-1
    command: "pg_isready -U {{ postgres_superuser }}"
  register: pg_ready
  # `pg_isready` only reads, so it is safe to run in --check mode. Without this, a dry run skips the
  # task and `until` fails ("object of type 'dict' has no attribute 'rc'").
  check_mode: false
  until: pg_ready.rc == 0
  retries: 10
  delay: 3
  become: false
  changed_when: false

- name: Create the environment databases
  community.docker.docker_container_exec:
    container: ladu-platform-postgres-1
    command: "psql -U {{ postgres_superuser }} -c \"CREATE DATABASE {{ item.db_name }}\""
  register: create_db
  # In --check mode the task is skipped and the result has no `rc`: the defaults keep the tests valid.
  failed_when: create_db.rc | default(0) != 0 and 'already exists' not in (create_db.stderr | default(''))
  changed_when: create_db.rc | default(1) == 0
  loop: "{{ environments }}"
  loop_control:
    label: "{{ item.db_name }}"
  become: false

- name: Create the environment database users
  community.docker.docker_container_exec:
    container: ladu-platform-postgres-1
    command: >-
      psql -U {{ postgres_superuser }} -c
      "CREATE USER {{ item.db_user }} WITH ENCRYPTED PASSWORD '{{ item.db_password }}'"
  register: create_user
  failed_when: create_user.rc | default(0) != 0 and 'already exists' not in (create_user.stderr | default(''))
  changed_when: create_user.rc | default(1) == 0
  loop: "{{ environments }}"
  loop_control:
    label: "{{ item.db_user }}"
  no_log: true
  become: false

- name: Grant each environment's user full privileges on its own database
  community.docker.docker_container_exec:
    container: ladu-platform-postgres-1
    command: >-
      psql -U {{ postgres_superuser }} -c
      "GRANT ALL PRIVILEGES ON DATABASE {{ item.db_name }} TO {{ item.db_user }}"
  register: grant_result
  failed_when: grant_result.rc | default(0) != 0
  changed_when: false
  loop: "{{ environments }}"
  loop_control:
    label: "{{ item.db_name }}"
  become: false

# Database-level privileges above don't cover the public *schema* inside
# that database. Postgres 15 stopped granting CREATE on the public schema
# to everyone by default (only the schema's owner — here, postgres_superuser,
# since it ran CREATE DATABASE — gets it automatically), so without this,
# each environment's own user can connect and SELECT but can't CREATE TABLE
# in its own database. Must target -d {{ item.db_name }} specifically —
# schemas are per-database, so running this without -d would grant on
# whatever database psql defaults to, not the one we mean.
- name: Grant each environment's user rights on its database's public schema
  community.docker.docker_container_exec:
    container: ladu-platform-postgres-1
    command: >-
      psql -U {{ postgres_superuser }} -d {{ item.db_name }} -c
      "GRANT ALL ON SCHEMA public TO {{ item.db_user }}"
  register: schema_grant_result
  failed_when: schema_grant_result.rc | default(0) != 0
  changed_when: false
  loop: "{{ environments }}"
  loop_control:
    label: "{{ item.db_name }}"
  become: false

# --- Sub-slice 8d: close the DOCKER-USER gap, and Docker log rotation. ---

- name: Fetch current Cloudflare IPv4 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v4
    return_content: true
  register: cf_ipv4_dockeruser
  # A read-only download, so it is safe to run in --check mode. Without this,
  # a dry run skips it and the next task fails ("no attribute 'content'").
  check_mode: false
  retries: 3
  delay: 5
  until: cf_ipv4_dockeruser.status == 200

- name: Fetch current Cloudflare IPv6 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v6
    return_content: true
  register: cf_ipv6_dockeruser
  # A read-only download, so it is safe to run in --check mode. Without this,
  # a dry run skips it and the next task fails ("no attribute 'content'").
  check_mode: false
  retries: 3
  delay: 5
  until: cf_ipv6_dockeruser.status == 200

- name: Write the DOCKER-USER firewall script
  ansible.builtin.template:
    src: docker-user-firewall.sh.j2
    dest: /usr/local/bin/docker-user-firewall.sh
    owner: root
    group: root
    mode: "0755"
  vars:
    cloudflare_ipv4_ranges: "{{ cf_ipv4_dockeruser.content.split() }}"
    cloudflare_ipv6_ranges: "{{ cf_ipv6_dockeruser.content.split() }}"

- name: Create the docker.service.d directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the docker.service drop-in that reapplies it on every start
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/docker-user-firewall.conf
    content: |
      [Service]
      ExecStartPost=/usr/local/bin/docker-user-firewall.sh
    owner: root
    group: root
    mode: "0644"
  register: docker_user_dropin

- name: Reload systemd units if the drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: docker_user_dropin.changed

- name: Apply the DOCKER-USER rules now, not just on the next Docker start
  ansible.builtin.command: /usr/local/bin/docker-user-firewall.sh
  changed_when: false

- name: Configure Docker's default container log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"
  register: docker_daemon_json

- name: Restart Docker if its daemon config changed
  # Safe: postgres/edge both use `restart: unless-stopped`, so they come
  # back up automatically. This also re-triggers the docker-user-firewall
  # drop-in above, as a live end-to-end check that the hook itself works.
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_daemon_json.changed
