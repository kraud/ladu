# One VPS hosts both staging and production (see deployment-strategy.md §2).
# No environment-level host groups are needed — the `platform` role
# provisions both environments' directories/DBs on this single host.
#
# Bootstrap note: on the very first run, the `deploy` user below does not
# exist yet — only `root` does. Override for that one run with:
#   ansible-playbook site.yml -e ansible_user=root -e ansible_ssh_pass=... --ask-pass
# or, if you're using the key Netcup let you set at order time for root:
#   ansible-playbook site.yml -e ansible_user=root -e ansible_ssh_private_key_file=~/.ssh/<root-key>
# After the `base` role creates `deploy` and locks out root, drop the
# override — every later run uses the settings below as-is.

all:
  hosts:
    vps:
      ansible_host: 152.53.146.206
      ansible_user: deploy
      ansible_ssh_private_key_file: ~/.ssh/ladu_deploy
